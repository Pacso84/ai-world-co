name = "aiworld-telegram"
main = "src/worker.js"
compatibility_date = "2024-11-01"
# nodejs_compat: a mimetext csomag (email-ág, Task 6) a "mime-types" függőségén
# keresztül node "path" beépített modult importál — enélkül a bundle nem épül.
compatibility_flags = ["nodejs_compat"]

# Nyilvános, nem-titkos változó. A titkokat NEM ide tesszük, hanem:
#   wrangler secret put BOT_TOKEN
#   wrangler secret put OWNER_CHAT_ID
#   wrangler secret put GH_TOKEN
#   wrangler secret put WEBHOOK_SECRET
[vars]
GH_REPO = "Pacso84/ai-world-co"
# Ügyfélszolgálat worker-oldali kill-switch (2026-07-20): "false" → /chat,/contact,email 503/eldob.
# ÉLESÍTVE 2026-07-20: "true" (valódi Turnstile-secret + site-widget is bekapcsolva).
# Vészleállítás = ezt "false"-ra + wrangler deploy (a végpontok azonnal 503).
CS_ENABLED = "true"

# Olvasói 👍/👎 visszajelzés tárolója (2026-07-07)
[[kv_namespaces]]
binding = "FEEDBACK"
id = "3ec3cac8de4247d09ddac8b245f9b985"

# Workers AI — az ügyfélszolgálat ingyenes válasz-motorja (env.AI)
[ai]
binding = "AI"
