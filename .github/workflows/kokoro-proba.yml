# KOKORO-82M PRÓBA (2026-11-19) — CSAK KÉZI INDÍTÁS, a napi gépsort NEM futtatja, költsége $0, élesben semmit nem változtat.
# Cél: tartalék felolvasó az Edge TTS mellé (lásd core/kokoro-proba.py fejléce). A hangminták artifactként letölthetők.
name: Kokoro TTS próba
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  proba:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Függőségek (CPU-s torch, kokoro, espeak-ng)
        run: |
          T0=$(date +%s)
          sudo apt-get install -y -qq espeak-ng >/dev/null
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "kokoro>=0.9.2" soundfile
          echo "telepítés: $(( $(date +%s) - T0 )) mp"
      - name: Próba
        run: python core/kokoro-proba.py
      - uses: actions/upload-artifact@v4
        with:
          name: kokoro-hangmintak
          path: kokoro-ki/
          retention-days: 14
