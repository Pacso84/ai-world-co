name: MI-videó — napi összefoglaló BEMUTATÓ (kézi)

# KÉZZEL indított bemutató (2026-10-10, user: „mielőtt kirakod, szeretném látni"):
# a mai hírekből „Today in AI" videó, ingyenes Hugging Face ZeroGPU MI-klipekkel.
# NEM posztol, NEM commitol — a videó artifactként letölthető. Lásd
# core/daily-summary-video.js és core/napi-osszesito-proba.js.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: video-proba
  cancel-in-progress: false

jobs:
  bemutato:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Függőségek
        run: npm install
      - name: ffmpeg + betűtípus
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fontconfig
          mkdir -p "$HOME/.local/share/fonts"
          cp shared/fonts/schibsted-grotesk-900.ttf "$HOME/.local/share/fonts/"
          fc-cache -f
      - name: Napi összefoglaló legyártása
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: node core/napi-osszesito-proba.js
      - name: Videó mentése
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osszesito-proba
          path: osszesito-proba/
          retention-days: 7
