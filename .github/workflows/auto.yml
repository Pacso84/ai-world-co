name: AI World Co. — auto pipeline

# Felhős cron: 8 óránként lefuttatja a teljes pipeline-t (hírkeresés →
# cikk/útmutató írás → ellenőrzés → párosítás → build) és élesre deployol.
# A gépednek NEM kell bekapcsolva lennie — a GitHub szerverén fut, ingyen.
on:
  schedule:
    - cron: '0 */8 * * *'   # 00:00, 08:00, 16:00 UTC (naponta 3x)
  workflow_dispatch: {}       # kézi indítás a GitHub felületről is

permissions:
  contents: write             # a generált tartalom visszacommitolásához

concurrency:
  group: aiworld-auto
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Biztonsági plafon: beragadás esetén ne égessünk órákat
    # (2026-07-01: két 6 órás beragadás ~720 ingyen-percet vitt el).
    #
    # 60 → 120 PERC (2026-07-31). A 07-31 01:47-es futás 65 percnél BELEFUTOTT
    # a 60-as plafonba, és a job MEGSZAKADT a Deploy közben. A mérés:
    #     Pipeline 29,5p + Fordítás 29,5p + felújító 2,9p + a többi ~3p
    # A lépések SAJÁT korlátainak összege 111 perc (45+30+10+10+10+6) — vagyis
    # a 60-as job-plafon SOHA nem fért volna hozzájuk. Eddig csak azért nem
    # derült ki, mert a lépések ritkán merítették ki a keretüket.
    #
    # MIÉRT SÚLYOS EZ: egy MEGSZAKÍTOTT (cancelled) jobnál a GitHub az
    # `if: always()` lépéseket is KIHAGYJA — nem csak a hibásakat. Így a
    # "Generált tartalom megőrzése (visszacommit)" nem futott le, és a futás
    # EGÉSZ MUNKÁJA elveszett: a megírt cikkek, a felújítások ÉS a költség-napló
    # is. Az `if: always()` védelem tehát a job-időtúllépés ellen NEM véd.
    #
    # A 120 perc nem pazarlás: a repó 2026-07-26 óta PUBLIKUS → az Actions
    # INGYENES ÉS KORLÁTLAN. A régi 60-as érték a privát repó 2000 perces
    # havi kerete miatt volt szűk; az az ok megszűnt, a kockázat maradt.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Függőségek
        run: npm install

      - name: Pipeline (hírkeresés + cikk/útmutató írás + ellenőrzés)
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CLOUDFLARE_FLUX_TOKEN: ${{ secrets.CLOUDFLARE_FLUX_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # A forrás-kutató Telegramon jelzi az új, jóváhagyható forrásokat:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
        # LÉPÉS-SZINTŰ IDŐKORLÁT (2026-07-23): a 07-22/07-23 éjjeli futásokban ez
        # a lépés 57 PERCET vitt el a 60-ból → a job-időkorlát megölte a futást,
        # és a BUILD + DEPLOY ki sem futott (a friss cikkek nem kerültek ki az
        # oldalra). A munka SORALAPÚ: ami itt kimarad, a következő futás
        # folytatja — a kiadás viszont nem tűrhet halasztást.
        # 2026-07-28: 34 → 45 perc. A 07-28 01:27-es futás PONTOSAN a 34 percnél
        # bukott el (egy útmutató-írás beleszaladt a 8 perces beragadás-védőidőbe,
        # és elvitte a keretet). A 34 perc még a PRIVÁT repó metered-perc korszakából
        # maradt; a repó 07-26 óta PUBLIKUS → az Actions ingyenes és korlátlan, tehát
        # a szűk keret már csak kárt okoz. A 60 perces job-plafon továbbra is véd.
        #
        # 2026-08-03: 45 → 55 perc, ÉS a pipeline saját PUHA kerete 42 perc
        # (--max-minutes lentebb). ÖV ÉS NADRÁGTARTÓ:
        #   • a puha keret a NORMÁL működés — 42 percnél a CEO maga hagyja ki a
        #     díszítő fázisokat (idle-fill, designer, seo, layout), és rendben
        #     befejezi. Amit kihagy, azt a következő futás elvégzi.
        #   • az 55 perc a VÉGSŐ háló, ha valami a puha keret ELLENÉRE elhúzódik
        #     (pl. egyetlen agent beragad a 8 perces védőidejéig).
        # Kiváltó eset: a 08-03 01:47-es futás pontosan 45:13-nál esett ki — a két
        # új forrás (Pixlr, PicsArt) 19 jelöltet adott a szokásos 0-5 helyett.
        # A tartalom nem veszett el (a kiadási lánc if:always()), de a futás
        # "failure" lett, és egy MENET KÖZBEN elvágott lépés kockázatos.
        timeout-minutes: 55
        # --skip-translate (2026-07-23): a ceo-pipeline BEÉPÍTETT fordítást is
        # csinál (5c lépés, limit 40), DE a munkafolyamatnak van rá KÜLÖN lépése
        # (lentebb: "Fordítás", limit 80, if:always, 12 perc kerettel). Mérés a
        # 07-23 reggeli futáson: a 34 perc = 13,8p ÍRÁS + 20,3p redundáns beépített
        # FORDÍTÁS. A kihagyással a lépés ~14 percre esik (bőven a sapka alatt),
        # és futásonként ~20 fizetős CI-percet spórol. A fordítás semmit nem veszít:
        # a dedikált lépés a build ELŐTT fut, ugyanabban a futásban publikál.
        # (Helyi `node agents/ceo/agent.js` VÁLTOZATLAN — kézi teszthez teljes flow.)
        run: node agents/ceo/agent.js --skip-translate --max-minutes 42

      # Heti extrák (2026-07-08): vasárnap összefoglaló, szerdán összehasonlító.
      # Vázlatot írnak (WRITER_) — a KÖVETKEZŐ ceo-futás Ellenőrzője viszi át
      # a kapun. Belső naptár-őrrel maguk döntik el, mikor van dolguk.
      - name: Heti összefoglaló + összehasonlító (vázlat)
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          node agents/digest/agent.js || true
          node agents/compare/agent.js || true

      # ÍGÉRET-FEDEZET FELÚJÍTÓ (2026-07-27, user-döntés: fokozatosan).
      # 76 régi cikkünk ígér a címében utasítást, de hírként íródott, ezért
      # vékony maradt (a user egy ilyet olvasott: "nem túl részletes"). Az iro 4b
      # szabálya + az ellenőrző kapuja a JÖVŐT rendezi; ez a MÚLTAT, futásonként
      # 2 cikkel (~4 hét alatt mind, ~$0.01/cikk). A régi verzió mindig kint
      # marad, amíg az új nem megy át ugyanazon az ellenőrzésen — nincs lyuk az
      # oldalon. A FORDÍTÁS lépés ELŐTT fut, hogy a felújított szöveg még ebben
      # a futásban kimenjen mind az 5 nyelven.
      - name: Régi "hogyan"-cikkek felújítása (2/futás)
        # if: always() — a 2026-07-28-i futáson a Pipeline lépés időtúllépéssel
        # elbukott, és ez a lépés emiatt KIMARADT. A felújítás nem függ a
        # Pipeline sikerétől (a MÁR KINT LÉVŐ cikkeket javítja), ezért fusson
        # akkor is, ha az írás-ág megbotlott.
        if: always()
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        # 10 → 15 perc (2026-07-31): a 18:51-es futásban a lépés PONT a 10
        # percnél halt el — a || true a lépés-timeout ellen NEM véd (a GitHub
        # a timeoutot a shell-től függetlenül üti). 2 cikk × max 8 perces
        # beragadás-védő hívás elméletben 16 perc is lehet; a 15 a reális
        # csúcsot fedi, a maradékot a következő futás úgyis folytatja.
        timeout-minutes: 15
        run: node agents/iro/upgrade-howtos.js --limit 2 || true

      # BORÍTÓKÉP-FELÚJÍTÁS (2026-07-30, user: "az útmutató képek is a
      # leírásból származzanak").
      #
      # A 2026-07-30 előtti képek úgy készültek, hogy az "art director" CSAK a
      # címet és az alcímet látta — a cikk szövegét soha. Ebből félrevezető
      # borítók lettek. Mért példa ugyanarra az útmutatóra:
      #   RÉGI: "áttetsző ROBOT-KOPONYA elektródákkal, világító CPU-agy"
      #   ÚJ:   "laptop az OpenAI Playground felülettel, chat-buborékok"
      # (a cikk arról szól, hogyan jelentkezz be és kérj API-kulcsot).
      #
      # ÚTMUTATÓK ELŐRE: azok evergreenek, azokat pineljük, és a user
      # kifejezetten őket kérte — 245 db ~28 nap alatt. A hír borítója amúgy is
      # elavul. A kép-generálás INGYENES (Cloudflare Flux), a jelenet-leírás
      # ~$0,0005/db → az egész felújítás ~$0,28.
      # ÜTEM 3 → 8 (2026-08-01). Mérve: 581 borítóképből 48 kész, 533 hátra;
      # 3/futás × 3 futás/nap = 9/nap → 60 NAP. Mivel addig a Google Discover
      # a cikkek 92%-át kizárja, az ütem maga volt a szűk keresztmetszet.
      # MIÉRT BIZTONSÁGOS: a kép INGYENES (Cloudflare Flux, 10 000 neuron/nap;
      # egy 1280×720-as kép nagyságrendileg ~70 neuron → napi ~140 fér bele,
      # most ~12-nél tartunk). 8/futás = 24/nap + az új cikkek ~6 → ~30/nap,
      # tehát a szabad keret negyede. Idő: ~7 mp/kép → +35 mp futásonként.
      # Költség: a jelenet-leírás ~$0,0007/db → a TELJES hátralék ~$0,37.
      # FIGYELENDŐ: ha Flux-kvótahiba jönne, ELŐSZÖR ezt vidd vissza 3-ra —
      # az új cikkek borítója fontosabb, mint a régiek felújítása.
      - name: Borítóképek felújítása (8/futás, útmutatók előre)
        if: always()
        timeout-minutes: 10
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_FLUX_TOKEN: ${{ secrets.CLOUDFLARE_FLUX_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
        run: node agents/designer/agent.js --refresh 8 || true

      # TÉNY-ELLENŐRZŐ (2026-07-30): a MÁR KINT LÉVŐ útmutatók frissesség-őre.
      #
      # MIÉRT KELLETT: a hitelesség-kapu (core/truth-gate.js) CSAK publikálás
      # ELŐTT ellenőriz. A 240 kint lévő útmutatót azóta senki nem nézte újra —
      # ha egy cég kivesz vagy átnevez egy funkciót, a mi útmutatónk NÉMÁN
      # hazuggá válik, és ezt ma semmi nem venné észre. Az agent 2026-06-22 óta
      # készen állt, csak sosem kötötték be.
      #
      # BIZTONSÁG (a bekötés ELŐTT átépítve): SOHA nem töröl publikált oldalt.
      # Helyben javít (az URL nem mozdul); ha a javítás nem elég ép, a RÉGI
      # marad; "tárgytalan" ítéletnél csak MEGJELÖL és szól — egy oldal levétele
      # emberi döntés (404 + elveszett rangsor-erő + 301 kellene hozzá).
      #
      # ÜTEM: 2/futás = 6/nap → a 240 útmutató ~40 naponta körbeér. ~$0,005
      # útmutatónként, azaz ~$0,9/hó egy valódi hitelességi védőhálóért.
      # 30 napnál fiatalabbhoz nem nyúl (azt a kapu épp most engedte át).
      - name: Tény-ellenőrző (kint lévő útmutatók frissessége)
        if: always()
        timeout-minutes: 10
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
        run: node agents/fact-check/agent.js --limit 2 || true

      # Orbit heti videó: szkript + hang (vasárnap; a videót a compose rakja össze)
      - name: Orbit videó — szkript + hang (vasárnap)
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
        run: node agents/video/agent.js || true

      # ── KÖZBENSŐ MENTÉS (2026-07-31) ─────────────────────────────────
      # MIÉRT: a 07-31 01:47-es futás a 60 perces job-plafonba futott, és a
      # GitHub MEGSZAKÍTOTTA. Megszakított jobnál az `if: always()` lépések is
      # KIMARADNAK — így a záró visszacommit sem futott le, és a futás EGÉSZ
      # munkája elveszett: a megírt cikkek, a felújítások és a költség-napló is.
      #
      # A job-plafont felemeltük (60 → 120), de az `always()` gyengesége attól
      # még ott van: bármilyen megszakadás (plafon, futtató-hiba, kézi leállítás)
      # ugyanígy mindent eldobna. Ezért itt, a leghosszabb lépés (Fordítás,
      # 30 perc) ELŐTT lementjük, ami addig elkészült.
      #
      # Így a legrosszabb eset is csak a fordítás-munkát veszti el (az amúgy is
      # utolér magát a következő futásban) — a MEGÍRT TARTALMAT soha.
      # A záró visszacommit változatlanul megmarad; ez csak egy korábbi mentőpont.
      - name: Közbenső mentés (a hosszú fordítás ELŐTT)
        if: always()
        run: |
          git config user.name "AI World Bot"
          git config user.email "bot@aiworld.local"
          git add -A
          git commit -m "auto: közbenső mentés $(date -u +%FT%TZ)" || { echo "nincs mentenivaló"; exit 0; }
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs || { git rebase --abort 2>/dev/null || true; }
            sleep 5
          done
          echo "⚠️ közbenső mentés nem ment fel — a záró commit még megpróbálja"

      - name: Fordítás (többnyelvűség — backfill, mindig fut)
        if: always()
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        # 30 → 35 PERC (2026-07-31). A 04:07-es futásban a fordító RENDESEN
        # dolgozott (154 fordítás), tisztán ki is lépett a saját 27 perces
        # keretén, kiírta az összegzést — és a lépés-korlát UGYANABBAN A
        # MÁSODPERCBEN ütött. A tiszta kilépés versenyzett a külső korláttal.
        #
        # Miért csúszott túl: a 27 perc a fordítási MUNKA kerete, de utána még
        # be kell fejeződnie a folyamatban lévő hívásnak (max 8 perces
        # beragadás-védőidő), plusz az indulás. 27 + ráhagyás > 30.
        #
        # A 35 perc így a VALÓDI vészfék marad, a 27 perces belső keret pedig
        # a rendes szabályozó — ez utóbbi az, ami menti a munkát és jelent.
        timeout-minutes: 35
        # 2026-07-26: a repó PUBLIKUS lett → GitHub Actions INGYEN+KORLÁTLAN, ezért
        # a korábbi szűk plafonokat (limit 80 / 9 perc / 12 perc timeout) FELOLDOTTUK.
        # Azok a privát repó havi 2000 ingyen perce miatt spóroltak, és rohamnál
        # (új forrás + kvóta-reset = sok cikk egyszerre) a maradékot a KÖVETKEZŐ
        # futásra halasztották (=látható fordítás-késés). Most egy roham is EGY
        # futásban utoléri magát. Ugyanannyi AI-token (=ugyanannyi költség), csak
        # gyorsabb; a --max-minutes 27 továbbra is tiszta kilépést garantál a 30-as
        # timeout ELŐTT, a $50-os havi AI-cap pedig a valódi költség-védőháló.
        #
        # --concurrency 5 (2026-07-27): a 27 perces keret ÖNMAGÁBAN nem volt elég.
        # Mérés: a SOROS fordító ~91 mp/darab → 27 perc = ~18 fordítás, a valós
        # futás pont 20-at ért el. Egy futás viszont 9-13 cikket ad ki = 36-52
        # fordítás → a maradék a KÖVETKEZŐ futásra (8 óra!) csúszott, és addig a
        # build angol fallbackot tett ki a hu/es/de/fr oldalakra ("a fordítások
        # késnek"). 4 sávon mérve 1,76 fordítás/perc (2,7x) → 5 sáv ~59 fordítás
        # / 27 perc, azaz a csúcs is elfér EGY futásban. A hívások száma és így a
        # KÖLTSÉG változatlan — csak nem várnak egymásra.
        run: node agents/translator/agent.js --limit 250 --max-minutes 27 --concurrency 5

      # ── KIADÁSI LÁNC (2026-07-23) ────────────────────────────────────
      # MIÉRT if: always() INNENTŐL: korábban ezek a lépések alapértelmezetten
      # csak sikeres előzmény után futottak — így egyetlen elakadt/kifutott
      # tartalmi lépés MEGAKADÁLYOZTA a kiadást, és a kész cikkek a repóban
      # ragadtak (2026-07-23: 6 hír + 3 útmutató nem került ki az oldalra).
      # A build a MEGLÉVŐ tartalomból dolgozik, tehát nyugodtan kiadható az is,
      # ami félbehagyott futásból maradt.

      # Minőség-ÖNJAVÍTÓ (2026-07-13, "ne csak szóljon, javítsa is"): a
      # determinisztikus csempe-hibákat KIJAVÍTJA a build előtt (témalista +
      # cikkek _meta); a javítás-napló a napi Telegram-jelentésbe kerül.
      - name: Minőség-önjavító (csempék)
        if: always()
        run: node core/quality-guard.js --fix || true

      # HÁZMESTER (2026-07-30): halott adat takarítása, MINDIG a build ELŐTT,
      # hogy a törölt képek fel se menjenek a Cloudflare-re.
      #
      # MIÉRT KELLETT: a user kérésére átvilágítottam a központot. A legnagyobb
      # tétel a memory/store.json volt — 2,2 MB, ebből 93% halott "embedding"
      # vektor egy KIVEZETETT szolgáltatástól. Ez a fájl MINDEN futásnál újra
      # bekerült a git-történetbe (133 példány), napi 3 futással évi ~2,2 GB.
      # Mellette 594 régi napló, 97 árva borítókép, 5 árva fordítás.
      #
      # Csak azt törli, amiről BIZONYÍTHATÓ, hogy nincs rá hivatkozás; ha bármi
      # bizonytalan, hozzá sem nyúl. Beépített őrszem szól, ha valami újra hízni
      # kezd — hogy ne fél év múlva, a lassú klónozásból derüljön ki.
      - name: Házmester (halott adat takarítása)
        if: always()
        run: node core/housekeeping.js || true

      # id + outcome: a deploy CSAK sikeres build után mehet — a build.js
      # ELŐSZÖR ÜRÍTI a website/public mappát, tehát egy bukott build után a
      # deploy LETÖRÖLNÉ az élő oldalt. Ez a feltétel a védőháló.
      - name: Weboldal build
        id: build
        if: always()
        run: node website/build.js

      # i18n-őrszem: angol maradványok a nem-EN oldalakon → hangos figyelmeztetés
      # a naplóban (a deployt nem állítja meg)
      - name: i18n-őrszem (angol maradvány-vadász)
        if: always()
        run: node website/check-i18n.js || true

      # SEO-ŐRSZEM (2026-07-27): a Search Console három NÉMA hibát jelzett —
      # .html-es (átirányító) canonical/hreflang/og:url/sitemap, cím-átdolgozás
      # miatt elköltözött oldalak (404 + elveszett rangsor-erő), és sitemap-URL
      # kiszolgáló fájl nélkül. Mindhárom hónapokig rejtve maradt, mert a honlap
      # közben tökéletesen működött. A build UTÁN, a deploy ELŐTT fut, hogy a
      # visszaesés a NAPLÓBAN és a napi riportban derüljön ki, ne fél év múlva
      # a Google-tól. A kiadást NEM állítja meg (|| true).
      - name: SEO-őrszem (kanonikus URL + slug-védelem)
        if: always() && steps.build.outcome == 'success'
        run: node core/seo-guard.js || true

      # Címes megosztás-képek a friss cikkekhez (FB-posztokhoz; 2026-07-08)
      # FIGYELEM: a build ÜRÍTI a public/-ot, ezért ennek a build UTÁN kell futnia.
      - name: Megosztás-képek (címes borítók)
        if: always() && steps.build.outcome == 'success'
        run: node core/share-images.js || true

      # Orbit heti videó összerakása (ffmpeg a runneren adott; mp4 nincs commitolva)
      - name: Orbit videó — összerakás (mp4)
        if: always()
        run: node core/video-compose.js || true

      - name: Deploy — Cloudflare Pages
        if: always() && steps.build.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        timeout-minutes: 6
        run: npx --yes wrangler pages deploy website/public --project-name=aiworldco --branch=main --commit-dirty=true

      # IndexNow: a friss cikkeket AZONNAL bejelentjük a keresőknek (Bing =
      # a ChatGPT-kereső indexe). Hiba esetén nem dönti el a futást (|| true).
      # ÉLŐ-ŐRSZEM (2026-07-31, a user kérdése után: "ezt hogy nem vettük
      # észre?"). A Google-audit 3 hibát talált, és mind azért maradt rejtve
      # hetekig, mert minden őrszemünk a SAJÁT fájljainkat nézi — kintről, a
      # Google szemével SENKI nem kérte le az oldalt. Ez a lépés a deploy után
      # valódi HTTP-kérésekkel ellenőrzi az ÉLŐ oldalt: www/http átirányítás,
      # valódi 404, kivezetett nyelvek, canonical/H1/Discover-jelzés a
      # legfrissebb cikken, sitemap épsége. Bizonyítottan tüzel: első futásán
      # elkapta a www-duplikációt. Lelet → napi Telegram-riport (🌐).
      - name: Élő-őrszem (kintről befelé nézés)
        if: always() && steps.build.outcome == 'success'
        run: node core/live-guard.js || true

      - name: IndexNow — friss URL-ek bejelentése
        if: always()
        run: node core/indexnow.js || true

      # Social: poszt-szöveg az új cikkekhez + kiküldés (Make webhook → FB oldal).
      # Max 2 poszt/futás (kulturált tempó); hiba nem dönti el a futást.
      - name: Social — poszt-gyártás + kiküldés
        if: always()
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          # 2026-07-25: a social átállt fizetős MiniMaxra (M2.5) — kell az OpenRouter
          # kulcs, különben minden fizetős hívása elhasal és a vészhálóra (ingyenes)
          # esik. Eddig ingyenes GLM-en futott, ezért nem volt itt.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          # PINTEREST (2026-07-25, forgalom-szerzés): a pinterest-poster erre a
          # webhookra POST-ol (Make → Create a Pin). Amíg a secret nincs beállítva,
          # a poszter kecsesen kihagyja magát (dormant) — nem hibázik.
          PINTEREST_MAKE_WEBHOOK_URL: ${{ secrets.PINTEREST_MAKE_WEBHOOK_URL }}
          # 2026-07-27: a poszter ELŐ-ELLENŐRZI a Make-forgatókönyvet ezzel a
          # tokennel. Kellett, mert a webhook 200-at ad akkor is, ha a
          # forgatókönyvben nincs Pinterest-modul — így 38 pin "kiküldve"
          # jelölést kapott, de sosem jelent meg. Token nélkül az ellenőrzés
          # kimarad (a poszter ilyenkor a régi módon küld).
          MAKE_API_TOKEN: ${{ secrets.MAKE_API_TOKEN }}
        run: |
          node agents/social/agent.js --limit 6 || true
          node agents/social/poster.js --limit 2 || true
          # Pinterest 3 → 5 / futás (2026-07-29, = 15/nap).
          # Ok: 73 EVERGREEN útmutató került vissza a sorba (a Pinterest 07-25-én
          # épült be, ezek a cikkek KORÁBBAN kaptak "skipped-old" jelölést — de a
          # Pinterestnél az útmutató nem évül el). A sor ~187-re nőtt; 9/nappal
          # 21 nap, 15/nappal ~12 nap. Óvatosan emelünk: a fiók fiatal, a hirtelen
          # nagy ütem levélszemétnek látszhat.
          node agents/social/pinterest-poster.js --limit 5 || true

      # Napi önjelentés a Főnöktől Telegramra (naponta 1x, a 7-15 UTC sávban)
      # FORRÁS-BIZONYÍTVÁNY (2026-07-22): osztályozza a hírforrásokat (frissesség +
      # termés + hitelesség-kapu blokkok). A halott/valótlant közlő forrást MAGÁTÓL
      # kikapcsolja (enabled:false), a többiről csak javaslatot tesz a napi riportban.
      # A riport ELŐTT fut, hogy a friss osztályzat kerüljön bele.
      - name: Forrás-bizonyítvány (osztályozás + halott források kikapcsolása)
        if: always()
        run: node core/source-report-card.js || true

      # if: always() (2026-07-21 audit) — ha egy korábbi lépés elhasal, a riport
      # ENÉLKÜL sosem menne ki: a hiba NÉMA maradna (mint a 9 napos FB-leállásnál).
      - name: Napi önjelentés (Telegram)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          # Make-őrszem (2026-07-15): a FB-posztoló forgatókönyv állapotát figyeli
          MAKE_API_TOKEN: ${{ secrets.MAKE_API_TOKEN }}
          # EGYENLEG-ŐR (2026-08-01): a riport lekérdezi a VALÓDI OpenRouter-
          # egyenleget. A havi keret csak egy szabály, amit mi tartunk be; a
          # feltöltött pénz viszont fizikai korlát — ha az fogy el, a cég
          # NÉMÁN elhallgat, jóval a keret elérése előtt. Read-only hívás, $0.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node core/daily-report.js || true

      # Heti kereső-riport (vasárnap): GSC+Bing számok + hírlevél-lámpa
      - name: Heti kereső-riport (Telegram)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
          BING_WM_API_KEY: ${{ secrets.BING_WM_API_KEY }}
          FEEDBACK_EXPORT_KEY: ${{ secrets.FEEDBACK_EXPORT_KEY }}
          # Cloudflare Web Analytics a heti riportban (összes látogató, 2026-07-11)
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node core/search-report.js || true

      # FORGALOM-NAPLÓ (2026-08-05): cikkenkénti napi látogatottság.
      # A Cloudflare a ~7 napnál régebbi napokat TÍZESRE KEREKÍTI, tehát amit
      # nem mentünk el naponta, az véglegesen elveszik. E nélkül nem dönthető
      # el, hogy a napok közti háromszoros szórás a TARTALOMBÓL jön-e vagy a
      # napból. Read-only Cloudflare-hívás, $0, nincs benne AI.
      - name: Forgalom-napló (cikkenkénti)
        env:
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node core/traffic-log.js || true

      # if: always() (2026-07-21 audit) — a költség-napló (core/budget-state.json)
      # CSAK itt őrződik meg. Enélkül egy bukott lépés az egész futás elköltött
      # pénzét ELDOBTA a nyilvántartásból → a havi plafon egyre kevesebbet mért.
      - name: Generált tartalom megőrzése (visszacommit)
        if: always()
        run: |
          git config user.name "AI World Bot"
          git config user.email "bot@aiworld.local"
          git add -A
          git commit -m "auto: pipeline run $(date -u +%FT%TZ)" || echo "nincs változás"
          # VERSENY-VÉDELEM: ha közben egy másik futás pusholt, rebase + újrapróba,
          # hogy a generált tartalom NE vesszen el csendben. (-X theirs: ütközésnél
          # a MI friss generált fájlunk nyer.)
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs || { git rebase --abort 2>/dev/null || true; }
            sleep 5
          done
          git push || echo "⚠️ push 3 próba után sem sikerült — e futás tartalma elveszhet!"
