name: AI World Co. — auto pipeline

# Felhős cron: 8 óránként lefuttatja a teljes pipeline-t (hírkeresés →
# cikk/útmutató írás → ellenőrzés → párosítás → build) és élesre deployol.
# A gépednek NEM kell bekapcsolva lennie — a GitHub szerverén fut, ingyen.
on:
  schedule:
    - cron: '0 */8 * * *'   # 00:00, 08:00, 16:00 UTC (naponta 3x)
  workflow_dispatch: {}       # kézi indítás a GitHub felületről is

permissions:
  contents: write             # a generált tartalom visszacommitolásához

concurrency:
  group: aiworld-auto
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Biztonsági plafon: beragadás esetén max 1 órát égetünk, nem 6-ot
    # (2026-07-01: két 6 órás beragadás ~720 ingyen-percet vitt el).
    # A repó PRIVÁT → az Actions-percek metertek (2000 ingyen/hó). 2026-07-23-i
    # mérés: 1390 perc 23 nap alatt = ~1874 perc/hó vetítve, a keret 94%-a. Ezért
    # kapott a hosszú lépések LÉPÉS-SZINTŰ korlátot (lásd lentebb) — így a job
    # sosem fut bele ebbe a plafonba, ahol a kiadási lánc elveszne.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Függőségek
        run: npm install

      - name: Pipeline (hírkeresés + cikk/útmutató írás + ellenőrzés)
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CLOUDFLARE_FLUX_TOKEN: ${{ secrets.CLOUDFLARE_FLUX_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # A forrás-kutató Telegramon jelzi az új, jóváhagyható forrásokat:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
        # LÉPÉS-SZINTŰ IDŐKORLÁT (2026-07-23): a 07-22/07-23 éjjeli futásokban ez
        # a lépés 57 PERCET vitt el a 60-ból → a job-időkorlát megölte a futást,
        # és a BUILD + DEPLOY ki sem futott (a friss cikkek nem kerültek ki az
        # oldalra). A munka SORALAPÚ: ami itt kimarad, a következő futás
        # folytatja — a kiadás viszont nem tűrhet halasztást.
        timeout-minutes: 34
        # --skip-translate (2026-07-23): a ceo-pipeline BEÉPÍTETT fordítást is
        # csinál (5c lépés, limit 40), DE a munkafolyamatnak van rá KÜLÖN lépése
        # (lentebb: "Fordítás", limit 80, if:always, 12 perc kerettel). Mérés a
        # 07-23 reggeli futáson: a 34 perc = 13,8p ÍRÁS + 20,3p redundáns beépített
        # FORDÍTÁS. A kihagyással a lépés ~14 percre esik (bőven a sapka alatt),
        # és futásonként ~20 fizetős CI-percet spórol. A fordítás semmit nem veszít:
        # a dedikált lépés a build ELŐTT fut, ugyanabban a futásban publikál.
        # (Helyi `node agents/ceo/agent.js` VÁLTOZATLAN — kézi teszthez teljes flow.)
        run: node agents/ceo/agent.js --skip-translate

      # Heti extrák (2026-07-08): vasárnap összefoglaló, szerdán összehasonlító.
      # Vázlatot írnak (WRITER_) — a KÖVETKEZŐ ceo-futás Ellenőrzője viszi át
      # a kapun. Belső naptár-őrrel maguk döntik el, mikor van dolguk.
      - name: Heti összefoglaló + összehasonlító (vázlat)
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          node agents/digest/agent.js || true
          node agents/compare/agent.js || true

      # ÍGÉRET-FEDEZET FELÚJÍTÓ (2026-07-27, user-döntés: fokozatosan).
      # 76 régi cikkünk ígér a címében utasítást, de hírként íródott, ezért
      # vékony maradt (a user egy ilyet olvasott: "nem túl részletes"). Az iro 4b
      # szabálya + az ellenőrző kapuja a JÖVŐT rendezi; ez a MÚLTAT, futásonként
      # 2 cikkel (~4 hét alatt mind, ~$0.01/cikk). A régi verzió mindig kint
      # marad, amíg az új nem megy át ugyanazon az ellenőrzésen — nincs lyuk az
      # oldalon. A FORDÍTÁS lépés ELŐTT fut, hogy a felújított szöveg még ebben
      # a futásban kimenjen mind az 5 nyelven.
      - name: Régi "hogyan"-cikkek felújítása (2/futás)
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        timeout-minutes: 10
        run: node agents/iro/upgrade-howtos.js --limit 2 || true

      # Orbit heti videó: szkript + hang (vasárnap; a videót a compose rakja össze)
      - name: Orbit videó — szkript + hang (vasárnap)
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
        run: node agents/video/agent.js || true

      - name: Fordítás (többnyelvűség — backfill, mindig fut)
        if: always()
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        timeout-minutes: 30
        # 2026-07-26: a repó PUBLIKUS lett → GitHub Actions INGYEN+KORLÁTLAN, ezért
        # a korábbi szűk plafonokat (limit 80 / 9 perc / 12 perc timeout) FELOLDOTTUK.
        # Azok a privát repó havi 2000 ingyen perce miatt spóroltak, és rohamnál
        # (új forrás + kvóta-reset = sok cikk egyszerre) a maradékot a KÖVETKEZŐ
        # futásra halasztották (=látható fordítás-késés). Most egy roham is EGY
        # futásban utoléri magát. Ugyanannyi AI-token (=ugyanannyi költség), csak
        # gyorsabb; a --max-minutes 27 továbbra is tiszta kilépést garantál a 30-as
        # timeout ELŐTT, a $50-os havi AI-cap pedig a valódi költség-védőháló.
        #
        # --concurrency 5 (2026-07-27): a 27 perces keret ÖNMAGÁBAN nem volt elég.
        # Mérés: a SOROS fordító ~91 mp/darab → 27 perc = ~18 fordítás, a valós
        # futás pont 20-at ért el. Egy futás viszont 9-13 cikket ad ki = 36-52
        # fordítás → a maradék a KÖVETKEZŐ futásra (8 óra!) csúszott, és addig a
        # build angol fallbackot tett ki a hu/es/de/fr oldalakra ("a fordítások
        # késnek"). 4 sávon mérve 1,76 fordítás/perc (2,7x) → 5 sáv ~59 fordítás
        # / 27 perc, azaz a csúcs is elfér EGY futásban. A hívások száma és így a
        # KÖLTSÉG változatlan — csak nem várnak egymásra.
        run: node agents/translator/agent.js --limit 250 --max-minutes 27 --concurrency 5

      # ── KIADÁSI LÁNC (2026-07-23) ────────────────────────────────────
      # MIÉRT if: always() INNENTŐL: korábban ezek a lépések alapértelmezetten
      # csak sikeres előzmény után futottak — így egyetlen elakadt/kifutott
      # tartalmi lépés MEGAKADÁLYOZTA a kiadást, és a kész cikkek a repóban
      # ragadtak (2026-07-23: 6 hír + 3 útmutató nem került ki az oldalra).
      # A build a MEGLÉVŐ tartalomból dolgozik, tehát nyugodtan kiadható az is,
      # ami félbehagyott futásból maradt.

      # Minőség-ÖNJAVÍTÓ (2026-07-13, "ne csak szóljon, javítsa is"): a
      # determinisztikus csempe-hibákat KIJAVÍTJA a build előtt (témalista +
      # cikkek _meta); a javítás-napló a napi Telegram-jelentésbe kerül.
      - name: Minőség-önjavító (csempék)
        if: always()
        run: node core/quality-guard.js --fix || true

      # id + outcome: a deploy CSAK sikeres build után mehet — a build.js
      # ELŐSZÖR ÜRÍTI a website/public mappát, tehát egy bukott build után a
      # deploy LETÖRÖLNÉ az élő oldalt. Ez a feltétel a védőháló.
      - name: Weboldal build
        id: build
        if: always()
        run: node website/build.js

      # i18n-őrszem: angol maradványok a nem-EN oldalakon → hangos figyelmeztetés
      # a naplóban (a deployt nem állítja meg)
      - name: i18n-őrszem (angol maradvány-vadász)
        if: always()
        run: node website/check-i18n.js || true

      # Címes megosztás-képek a friss cikkekhez (FB-posztokhoz; 2026-07-08)
      # FIGYELEM: a build ÜRÍTI a public/-ot, ezért ennek a build UTÁN kell futnia.
      - name: Megosztás-képek (címes borítók)
        if: always() && steps.build.outcome == 'success'
        run: node core/share-images.js || true

      # Orbit heti videó összerakása (ffmpeg a runneren adott; mp4 nincs commitolva)
      - name: Orbit videó — összerakás (mp4)
        if: always()
        run: node core/video-compose.js || true

      - name: Deploy — Cloudflare Pages
        if: always() && steps.build.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        timeout-minutes: 6
        run: npx --yes wrangler pages deploy website/public --project-name=aiworldco --branch=main --commit-dirty=true

      # IndexNow: a friss cikkeket AZONNAL bejelentjük a keresőknek (Bing =
      # a ChatGPT-kereső indexe). Hiba esetén nem dönti el a futást (|| true).
      - name: IndexNow — friss URL-ek bejelentése
        if: always()
        run: node core/indexnow.js || true

      # Social: poszt-szöveg az új cikkekhez + kiküldés (Make webhook → FB oldal).
      # Max 2 poszt/futás (kulturált tempó); hiba nem dönti el a futást.
      - name: Social — poszt-gyártás + kiküldés
        if: always()
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          # 2026-07-25: a social átállt fizetős MiniMaxra (M2.5) — kell az OpenRouter
          # kulcs, különben minden fizetős hívása elhasal és a vészhálóra (ingyenes)
          # esik. Eddig ingyenes GLM-en futott, ezért nem volt itt.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          # PINTEREST (2026-07-25, forgalom-szerzés): a pinterest-poster erre a
          # webhookra POST-ol (Make → Create a Pin). Amíg a secret nincs beállítva,
          # a poszter kecsesen kihagyja magát (dormant) — nem hibázik.
          PINTEREST_MAKE_WEBHOOK_URL: ${{ secrets.PINTEREST_MAKE_WEBHOOK_URL }}
          # 2026-07-27: a poszter ELŐ-ELLENŐRZI a Make-forgatókönyvet ezzel a
          # tokennel. Kellett, mert a webhook 200-at ad akkor is, ha a
          # forgatókönyvben nincs Pinterest-modul — így 38 pin "kiküldve"
          # jelölést kapott, de sosem jelent meg. Token nélkül az ellenőrzés
          # kimarad (a poszter ilyenkor a régi módon küld).
          MAKE_API_TOKEN: ${{ secrets.MAKE_API_TOKEN }}
        run: |
          node agents/social/agent.js --limit 6 || true
          node agents/social/poster.js --limit 2 || true
          node agents/social/pinterest-poster.js --limit 3 || true

      # Napi önjelentés a Főnöktől Telegramra (naponta 1x, a 7-15 UTC sávban)
      # FORRÁS-BIZONYÍTVÁNY (2026-07-22): osztályozza a hírforrásokat (frissesség +
      # termés + hitelesség-kapu blokkok). A halott/valótlant közlő forrást MAGÁTÓL
      # kikapcsolja (enabled:false), a többiről csak javaslatot tesz a napi riportban.
      # A riport ELŐTT fut, hogy a friss osztályzat kerüljön bele.
      - name: Forrás-bizonyítvány (osztályozás + halott források kikapcsolása)
        if: always()
        run: node core/source-report-card.js || true

      # if: always() (2026-07-21 audit) — ha egy korábbi lépés elhasal, a riport
      # ENÉLKÜL sosem menne ki: a hiba NÉMA maradna (mint a 9 napos FB-leállásnál).
      - name: Napi önjelentés (Telegram)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          # Make-őrszem (2026-07-15): a FB-posztoló forgatókönyv állapotát figyeli
          MAKE_API_TOKEN: ${{ secrets.MAKE_API_TOKEN }}
        run: node core/daily-report.js || true

      # Heti kereső-riport (vasárnap): GSC+Bing számok + hírlevél-lámpa
      - name: Heti kereső-riport (Telegram)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
          BING_WM_API_KEY: ${{ secrets.BING_WM_API_KEY }}
          FEEDBACK_EXPORT_KEY: ${{ secrets.FEEDBACK_EXPORT_KEY }}
          # Cloudflare Web Analytics a heti riportban (összes látogató, 2026-07-11)
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node core/search-report.js || true

      # if: always() (2026-07-21 audit) — a költség-napló (core/budget-state.json)
      # CSAK itt őrződik meg. Enélkül egy bukott lépés az egész futás elköltött
      # pénzét ELDOBTA a nyilvántartásból → a havi plafon egyre kevesebbet mért.
      - name: Generált tartalom megőrzése (visszacommit)
        if: always()
        run: |
          git config user.name "AI World Bot"
          git config user.email "bot@aiworld.local"
          git add -A
          git commit -m "auto: pipeline run $(date -u +%FT%TZ)" || echo "nincs változás"
          # VERSENY-VÉDELEM: ha közben egy másik futás pusholt, rebase + újrapróba,
          # hogy a generált tartalom NE vesszen el csendben. (-X theirs: ütközésnél
          # a MI friss generált fájlunk nyer.)
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs || { git rebase --abort 2>/dev/null || true; }
            sleep 5
          done
          git push || echo "⚠️ push 3 próba után sem sikerült — e futás tartalma elveszhet!"
