# ===================================================================
# PINTEREST — KÉZI KÜLDÉS ("küldj pineket MOST")
# ===================================================================
# Miért külön munkafolyamat: a teljes auto.yml ~35 perc, és mindent lefuttat
# (cikkírás, fordítás, build, deploy). Ha csak azt akarjuk ellenőrizni, hogy a
# Make-lánc működik-e — vagy gyorsabban akarjuk üríteni a pin-sort —, ez a
# ~1 perces futás elég.
#
# A poszter ELŐ-ELLENŐRZI a Make-forgatókönyvet (usedPackages), így hiányos
# lánc esetén NEM küld semmit, és a sor sértetlen marad.
#
# Kézi indítás: GitHub → Actions → "Pinterest — kézi küldés" → Run workflow.
# ===================================================================
name: Pinterest — kézi küldés

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Hány pin menjen ki most?'
        required: false
        default: '3'

jobs:
  pin:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # a posted_pin jelölés visszacommitolásához
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci || npm install
      - name: Pinek küldése
        env:
          PINTEREST_MAKE_WEBHOOK_URL: ${{ secrets.PINTEREST_MAKE_WEBHOOK_URL }}
          MAKE_API_TOKEN: ${{ secrets.MAKE_API_TOKEN }}
        run: node agents/social/pinterest-poster.js --limit ${{ inputs.limit }}
      - name: Jelölések visszacommitolása
        run: |
          git config user.name "aiworld-bot"
          git config user.email "bot@aiworldhq.com"
          git add content/social/ || true
          git diff --staged --quiet || git commit -m "pinterest: kézi küldés ($(date -u +%H:%M UTC))"
          git push || true
