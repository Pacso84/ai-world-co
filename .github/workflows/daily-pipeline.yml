# ===================================================================
# AI WORLD — Napi pipeline (felhőben, gép nélkül)
# ===================================================================
# "Fut amíg alszol": a teljes agent-pipeline naponta lefut a GitHub
# felhőjében, a géped lehet kikapcsolva. Ingyenes (GitHub Actions).
#
# AKTIVÁLÁS (majd élesítéskor):
#   1. Töltsd fel a projektet GitHub-ra
#   2. Settings -> Secrets and variables -> Actions -> add hozzá:
#        GOOGLE_API_KEY, ANTHROPIC_API_KEY, GROQ_API_KEY (amid van)
#   3. Ettől kezdve magától fut a cron szerint (kézzel is: "Run workflow")
# ===================================================================

name: Daily AI World Pipeline

on:
  schedule:
    # 20:00 UTC = ~6-7 reggel Sydney-ben (ausztrál olvasóknak friss reggeli tartalom)
    - cron: "0 20 * * *"
  workflow_dispatch: {}   # kézi indítás gombbal is

permissions:
  contents: write          # hogy vissza tudja menteni az új cikkeket

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run the AI company pipeline (CEO orchestrates all agents)
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node agents/ceo/agent.js

      - name: Commit new content & learning back to repo
        run: |
          git config user.name "AI World Bot"
          git config user.email "bot@aiworld.local"
          git add content/ memory/ sources/source-stats.json website/assets/images/ agents/iro/improvement-suggestions.md 2>/dev/null || true
          git commit -m "Daily pipeline: new articles & learning [skip ci]" || echo "Nothing new to commit"
          git push || echo "Push skipped"

      # Deploy: amíg config.deploy.method = none, csak build történik.
      # Cloudflare Pages a repóhoz kötve auto-deploy-ol a fenti commit után,
      # VAGY ide jön majd a wrangler deploy lépés (élesítéskor).
