name: Telegram command — Főnök parancs

# A Cloudflare Worker indítja (repository_dispatch) minden engedélyezett
# Telegram-parancsnál. Lefuttatja a főnök parancs-értelmezőt, ami elvégzi a
# munkát (tartalom + deploy) és Telegramon visszaír az eredménnyel.
on:
  repository_dispatch:
    types: [telegram-command]

permissions:
  contents: write

concurrency:
  group: aiworld-telegram
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Biztonsági plafon: beragadás esetén max 45 percet égetünk, nem 6 órát.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Függőségek
        run: npm install

      - name: Parancs végrehajtása (főnök)
        env:
          TELEGRAM_TEXT: ${{ github.event.client_payload.text }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CLOUDFLARE_FLUX_TOKEN: ${{ secrets.CLOUDFLARE_FLUX_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 2. fázis (2026-07-08): "posztolj most" parancshoz kell a Make webhook
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: node agents/ceo/instruct.js

      - name: Generált tartalom megőrzése (visszacommit)
        run: |
          git config user.name "AI World Bot"
          git config user.email "bot@aiworld.local"
          git add -A
          git commit -m "telegram: parancs $(date -u +%FT%TZ)" || echo "nincs változás"
          # VERSENY-VÉDELEM: ha közben egy másik futás pusholt, rebase + újrapróba,
          # hogy a jóváhagyott forrás / generált tartalom NE vesszen el csendben.
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs || { git rebase --abort 2>/dev/null || true; }
            sleep 5
          done
          git push || echo "⚠️ push 3 próba után sem sikerült — e futás tartalma elveszhet!"
