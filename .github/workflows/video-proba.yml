name: MI-videó — kvóta-próba (kézi)

# KÉZZEL indított PRÓBA (2026-10-09): a Hugging Face ZeroGPU ingyenes keretéből
# két rövid MI-klipet készít a user kulcsával (HF_TOKEN), és eldönti, hogy a
# GitHub futtatóról a FIÓK kerete számít-e. Nem posztol, nem commitol, $0.
# A klipek és az eredmény letölthető artifactként. Lásd core/zerogpu-proba.js.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: video-proba
  cancel-in-progress: false

jobs:
  proba:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Két MI-klip a ZeroGPU-ról
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: node core/zerogpu-proba.js

      - name: Klipek és eredmény mentése
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-proba
          path: video-proba/
          retention-days: 7
